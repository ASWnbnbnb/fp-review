<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FP · 每日复盘 · 云端快照</title>
<style>
  :root {
    --bg: #ffffff;
    --panel-bg: #fafafa;
    --card-bg: #f5f5f5;
    --text: #1a1a2e;
    --text-secondary: #6b6b80;
    --text-muted: #9a9ab0;
    --border: #e5e5ea;
    --border-light: #eeeeee;
    --accent: #6366f1;
    --accent-glow: rgba(99,102,241,0.15);
    --green: #10b981;
    --orange: #f59e0b;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--panel-bg);
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .logo .dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-glow);
  }

  .cal-trigger {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    background: var(--card-bg);
    border: 1px solid transparent;
    position: relative;
  }
  .cal-trigger:hover { color: var(--text); border-color: var(--border); }
  .cal-trigger .date-display { font-weight: 500; color: var(--text); }

  .topbar-stats {
    display: flex;
    gap: 20px;
  }
  .topbar-stat {
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .topbar-stat .val {
    color: var(--text);
    font-weight: 600;
  }

  .topbar-right {
    display: flex;
    gap: 8px;
  }
  .badge-snapshot {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(245,158,11,0.1);
    color: var(--orange);
    font-weight: 500;
  }

  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  .panel-left {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 24px;
    contain: layout style;
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .topic-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .topic-tag {
    padding: 6px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border-light);
    border-radius: 20px;
    font-size: 13px;
    color: var(--text);
  }

  .output-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .output-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    font-size: 13px;
  }
  .output-item:hover { border-color: var(--border); }
  .output-icon {
    width: 30px; height: 30px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .icon-code { background: #eef2ff; color: #6366f1; }
  .icon-doc  { background: #fffbeb; color: #f59e0b; }
  .icon-system { background: #f3f0ff; color: #8b5cf6; }
  .icon-data { background: #ecfdf5; color: #10b981; }
  .icon-video { background: #fef2f2; color: #ef4444; }

  .summary-text {
    font-size: 14px;
    line-height: 1.75;
    color: var(--text-secondary);
  }

  .timeline {
    position: relative;
    padding-left: 20px;
    border-left: 1px solid var(--border);
  }
  .timeline-item {
    margin-bottom: 14px;
    position: relative;
  }
  .timeline-item::before {
    content: '';
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    position: absolute;
    left: -24px;
    top: 4px;
  }
  .timeline-time {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 3px;
  }
  .timeline-text {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .decision-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .decision-item {
    font-size: 13px;
    color: var(--text-secondary);
    padding: 8px 12px;
    background: var(--card-bg);
    border-radius: var(--radius-sm);
    border-left: 2px solid var(--accent);
  }

  .panel-right {
    width: 420px;
    flex-shrink: 0;
    padding: 28px 28px;
    display: flex;
    flex-direction: column;
    background: var(--panel-bg);
  }
  .reflection-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .reflection-header h2 {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .reflection-status {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .status-empty { background: #f5f5f5; color: var(--text-muted); }
  .status-filled { background: rgba(16,185,129,0.08); color: var(--green); }

  .reflection-content {
    height: 260px;
    padding: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.8;
    color: var(--text-secondary);
    white-space: pre-wrap;
    overflow-y: auto;
  }
  .reflection-content.empty {
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 13px;
  }

  .reflection-content.log-content {
    height: auto;
    max-height: 420px;
    border-color: rgba(16,185,129,0.35);
    background: rgba(16,185,129,0.06);
  }

  .cal-overlay {
    position: absolute;
    top: 52px;
    left: 0;
    z-index: 100;
    display: none;
  }
  .cal-overlay.open { display: block; }

  .cal-popup {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin: 8px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.1);
    width: 280px;
  }
  .cal-popup-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-popup-header .month-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .cal-popup-nav { display: flex; gap: 2px; }
  .cal-popup-nav button {
    width: 26px; height: 26px;
    border: none; background: none;
    cursor: pointer; border-radius: 4px;
    font-size: 12px; color: var(--text-secondary);
  }
  .cal-popup-nav button:hover { background: var(--border); color: var(--text); }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    gap: 2px;
  }
  .cal-grid .dow {
    font-size: 10px;
    color: var(--text-muted);
    padding: 4px 0;
    font-weight: 500;
  }
  .cal-grid .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-secondary);
    position: relative;
    border: 1px solid transparent;
  }
  .cal-grid .day:hover { background: var(--border); color: var(--text); }
  .cal-grid .day.today { border-color: var(--accent); color: var(--text); font-weight: 600; }
  .cal-grid .day.selected { background: var(--accent); color: white; font-weight: 600; }
  .cal-grid .day.other-month { color: #d0d0d8; }
  .cal-grid .day.has-review::after {
    content: '';
    width: 4px; height: 4px;
    background: var(--accent);
    border-radius: 50%;
    position: absolute;
    bottom: 3px;
  }
  .cal-grid .day.selected.has-review::after { background: white; }
  .cal-grid .day.has-log::before {
    content: '';
    width: 4px; height: 4px;
    background: #10b981;
    border-radius: 50%;
    position: absolute;
    bottom: 3px;
    left: calc(50% + 6px);
  }
  .cal-grid .day.has-review.has-log::after { left: calc(50% - 8px); }

  .cal-popup-footer {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .cal-popup-footer button {
    font-size: 11px;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .cal-popup-footer button:hover { text-decoration: underline; }

  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
  }
  .empty-state .emoji { font-size: 36px; margin-bottom: 10px; }
  .empty-state p { font-size: 13px; }

  .footer-note {
    position: fixed;
    bottom: 8px;
    right: 16px;
    font-size: 11px;
    color: var(--text-muted);
    z-index: 200;
    pointer-events: none;
  }

  /* ========== 手机响应式 ========== */
  @media (max-width: 768px) {
    body { overflow: auto; height: auto; min-height: 100vh; }

    .topbar {
      height: auto;
      flex-wrap: wrap;
      padding: 12px 16px;
      gap: 8px;
    }
    .topbar-left { flex: 1; min-width: 0; }
    .topbar-stats { gap: 12px; }
    .topbar-right { width: 100%; }
    .badge-snapshot { font-size: 10px; }

    .main {
      flex: none;
      flex-direction: column;
    }

    .panel-left {
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 20px 16px;
      gap: 18px;
    }

    .panel-right {
      width: 100%;
      padding: 20px 16px;
    }

    .section-title { font-size: 10px; letter-spacing: 1px; }
    .topic-tag { font-size: 12px; padding: 5px 10px; }
    .summary-text { font-size: 13px; }
    .output-item { font-size: 12px; padding: 8px 10px; }
    .decision-item { font-size: 12px; }

    .reflection-content { height: 200px; font-size: 13px; }

    .cal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .cal-overlay.open { display: flex; }
    .cal-popup {
      margin: 16px;
      width: calc(100vw - 32px);
      max-width: 320px;
    }

    .footer-note { font-size: 10px; bottom: 4px; right: 8px; }
  }

  /* ========== 平板横屏保持 16:9 ========== */
  @media (min-width: 769px) and (max-width: 1024px) {
    .panel-right { width: 340px; padding: 24px 20px; }
    .panel-left { padding: 24px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <span class="dot"></span>FP · 每日复盘
    </div>
    <div class="cal-trigger" onclick="toggleCalendar()" id="calTrigger">
      📅 <span class="date-display" id="calTriggerDate">2026年8月7日</span>
    </div>
  </div>
  <div class="topbar-stats">
    <span class="topbar-stat">总复盘 <span class="val" id="stat-total">0</span> 天</span>
    <span class="topbar-stat">产出 <span class="val" id="stat-outputs">0</span> 项</span>
    <span class="topbar-stat">感想 <span class="val" id="stat-reflections">0</span> 篇</span>
  </div>
  <div class="topbar-right">
    <span class="badge-snapshot">📸 云端快照 · 2026-08-14</span>
  </div>
</div>

<div class="main">
  <div class="cal-overlay" id="calOverlay">
    <div class="cal-popup">
      <div class="cal-popup-header">
        <span class="month-label" id="monthLabel">2026年8月</span>
        <div class="cal-popup-nav">
          <button onclick="prevMonth()">◀</button>
          <button onclick="goToday()">今天</button>
          <button onclick="nextMonth()">▶</button>
        </div>
      </div>
      <div class="cal-grid" id="calendarGrid"></div>
      <div class="cal-popup-footer">
        <button onclick="toggleCalendar()">关闭日历</button>
      </div>
    </div>
  </div>

  <div class="panel-left" id="panelLeft">
    <div id="leftContent"></div>
  </div>

  <div class="panel-right" id="panelRight">
    <div id="rightContent"></div>
  </div>
</div>

<div class="footer-note">数据快照于 2026-08-14 · 思危的 WorkBuddy 复盘</div>

<script>
// ====== DATA LOADED DYNAMICALLY (fetch data.json, cache-busted) ======
var reviewIndex = {};
var dailyLogs = {};
var snapshotDate = '';

fetch('data.json?v=' + Date.now())
  .then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function(d) {
    reviewIndex = d.reviewIndex || {};
    dailyLogs = d.dailyLogs || {};
    snapshotDate = d.snapshotDate || '';
    if (snapshotDate) {
      document.querySelectorAll('.badge-snapshot').forEach(function(b) {
        b.textContent = '\u{1F4F8} 云端快照 \u00B7 ' + snapshotDate;
      });
      var fn = document.querySelector('.footer-note');
      if (fn) fn.textContent = '数据快照于 ' + snapshotDate + ' \u00B7 思危的 WorkBuddy 复盘';
    }
    init();
  })
  .catch(function(e) {
    var el = document.getElementById('rightContent');
    if (el) el.innerHTML = '<div style="padding:40px;color:#c00;font-family:sans-serif">数据加载失败：' + e.message + '<br>请刷新重试。</div>';
  });

// ====== State ======
var currentMonth = new Date().getMonth();
var currentYear = new Date().getFullYear();
var selectedDate = formatDate(new Date());
var calendarOpen = false;

// ====== Init ======

function init() {
  renderCalendar();
  renderAll(selectedDate);
  updateStats();
  updateTriggerDate(selectedDate);
}

document.addEventListener('click', function(e) {
  if (calendarOpen && !e.target.closest('.cal-overlay') && !e.target.closest('.cal-trigger')) {
    toggleCalendar();
  }
});

function hasReview(ds) { return reviewIndex && reviewIndex.reports && reviewIndex.reports[ds]; }
function hasReflection(ds) { return reviewIndex && reviewIndex.reflections && reviewIndex.reflections[ds] && reviewIndex.reflections[ds].trim(); }
function hasLog(ds) { return dailyLogs && dailyLogs[ds] && dailyLogs[ds].trim(); }

function toggleCalendar() {
  calendarOpen = !calendarOpen;
  document.getElementById('calOverlay').classList.toggle('open', calendarOpen);
}

function renderCalendar() {
  var grid = document.getElementById('calendarGrid');
  var dows = ['日','一','二','三','四','五','六'];
  var html = dows.map(function(d) { return '<div class="dow">' + d + '</div>'; }).join('');

  var firstDay = new Date(currentYear, currentMonth, 1).getDay();
  var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  var daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

  for (var i = firstDay - 1; i >= 0; i--) {
    html += '<div class="day other-month">' + (daysInPrevMonth - i) + '</div>';
  }

  var today = formatDate(new Date());
  for (var d = 1; d <= daysInMonth; d++) {
    var ds = formatDate(new Date(currentYear, currentMonth, d));
    var cls = 'day';
    if (ds === today) cls += ' today';
    if (ds === selectedDate) cls += ' selected';
    if (hasReview(ds)) cls += ' has-review';
    if (hasLog(ds)) cls += ' has-log';
    html += '<div class="' + cls + '" onclick="selectDay(\'' + ds + '\')">' + d + '</div>';
  }

  var remaining = 42 - firstDay - daysInMonth;
  for (var d = 1; d <= remaining; d++) {
    html += '<div class="day other-month">' + d + '</div>';
  }

  grid.innerHTML = html;
  document.getElementById('monthLabel').textContent = currentYear + '年' + (currentMonth+1) + '月';
}

function selectDay(ds) {
  selectedDate = ds;
  calendarOpen = false;
  document.getElementById('calOverlay').classList.remove('open');
  renderCalendar();
  renderAll(ds);
  updateTriggerDate(ds);
}

function prevMonth() {
  if (currentMonth === 0) { currentMonth = 11; currentYear--; }
  else currentMonth--;
  renderCalendar();
}
function nextMonth() {
  if (currentMonth === 11) { currentMonth = 0; currentYear++; }
  else currentMonth++;
  renderCalendar();
}
function goToday() {
  currentMonth = new Date().getMonth();
  currentYear = new Date().getFullYear();
  selectedDate = formatDate(new Date());
  renderCalendar();
  renderAll(selectedDate);
  updateTriggerDate(selectedDate);
}

function updateTriggerDate(ds) {
  var d = new Date(ds);
  document.getElementById('calTriggerDate').textContent = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}

function renderAll(ds) {
  renderLeft(ds);
  renderRight(ds);
}

function renderLeft(ds) {
  var date = new Date(ds);
  var today = formatDate(new Date());
  var container = document.getElementById('leftContent');

  if (ds > today) {
    container.innerHTML = '<div class="empty-state"><div class="emoji">⏳</div><p>还没到这一天</p></div>';
    return;
  }

  var report = (reviewIndex && reviewIndex.reports) ? reviewIndex.reports[ds] : null;
  var log = (typeof dailyLogs !== 'undefined' && dailyLogs) ? (dailyLogs[ds] || '') : '';

  if (!report) {
    if (log && log.trim()) {
      // 无复盘报告但有实时工作日志
      var html = '';
      html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:24px">';
      html += '<span style="font-size:20px;font-weight:700;color:var(--text)">' + date.getFullYear() + '年' + (date.getMonth()+1) + '月' + date.getDate() + '日</span>';
      html += '<span style="font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(16,185,129,0.15);color:#10b981">实时日志</span>';
      html += '<span style="font-size:11px;padding:3px 10px;border-radius:20px;background:var(--card-bg);color:var(--text-muted)">复盘待生成</span>';
      html += '</div>';
      html += '<div class="section-title">⚡ 今日工作日志（实时）</div>';
      html += '<div class="reflection-content log-content">' + escapeHtml(log) + '</div>';
      html += '<div style="margin-top:16px;padding:12px;border:1px dashed var(--border);border-radius:12px;font-size:12px;color:var(--text-muted)">💡 该日已完成工作，每日 18:00 自动复盘后将生成正式报告并替换此页。</div>';
      container.innerHTML = html;
      return;
    }
    container.innerHTML = '<div class="empty-state"><div class="emoji">📭</div><p>该日暂无复盘记录</p></div>';
    return;
  }

  var html = '';
  var dateLabel = ds === today ? '今天' : '历史';
  html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:24px">';
  html += '<span style="font-size:20px;font-weight:700;color:var(--text)">' + date.getFullYear() + '年' + (date.getMonth()+1) + '月' + date.getDate() + '日</span>';
  html += '<span style="font-size:11px;padding:3px 10px;border-radius:20px;background:' + (ds===today ? 'rgba(99,102,241,0.15)' : 'var(--card-bg)') + ';color:' + (ds===today ? 'var(--accent)' : 'var(--text-muted)') + '">' + dateLabel + '</span>';
  html += '</div>';

  if (report.topics && report.topics.length) {
    html += '<div class="section-title">🎯 对话主题</div><div class="topic-tags">';
    report.topics.forEach(function(t) { html += '<span class="topic-tag">' + escapeHtml(t) + '</span>'; });
    html += '</div><div style="margin-bottom:24px"></div>';
  }

  if (report.outputs && report.outputs.length) {
    html += '<div class="section-title">📦 产出内容</div><div class="output-list">';
    report.outputs.forEach(function(o) {
      var icons = { code: '💻', doc: '📄', system: '⚙️', data: '📊', video: '🎬', config: '⚙️' };
      var cls = 'icon-' + (o.type || 'doc');
      html += '<div class="output-item">';
      html += '<div class="output-icon ' + cls + '">' + (icons[o.type] || '📌') + '</div>';
      html += '<span>' + escapeHtml(o.title || o) + '</span>';
      html += '</div>';
    });
    html += '</div><div style="margin-bottom:24px"></div>';
  }

  if (report.summary) {
    html += '<div class="section-title">📝 工作概述</div><p class="summary-text">' + escapeHtml(report.summary) + '</p><div style="margin-bottom:24px"></div>';
  }

  if (report.timeline && report.timeline.length) {
    html += '<div class="section-title">⏱️ 时间线</div><div class="timeline">';
    report.timeline.forEach(function(t) {
      html += '<div class="timeline-item"><div class="timeline-time">' + escapeHtml(t.time) + '</div><div class="timeline-text">' + escapeHtml(t.text) + '</div></div>';
    });
    html += '</div><div style="margin-bottom:24px"></div>';
  }

  if (report.decisions && report.decisions.length) {
    html += '<div class="section-title">🔑 关键决策</div><div class="decision-list">';
    report.decisions.forEach(function(d) {
      html += '<div class="decision-item">• ' + escapeHtml(d) + '</div>';
    });
    html += '</div>';
  }

  container.innerHTML = html;
}

function renderRight(ds) {
  var today = formatDate(new Date());
  var reflection = (reviewIndex && reviewIndex.reflections) ? (reviewIndex.reflections[ds] || '') : '';
  var hasRef = reflection && reflection.trim();
  var container = document.getElementById('rightContent');

  var html = '';
  html += '<div class="reflection-header">';
  html += '<h2>💭 每日感想</h2>';
  html += '<span class="reflection-status ' + (hasRef ? 'status-filled' : 'status-empty') + '">' + (hasRef ? '已记录' : '未填写') + '</span>';
  html += '</div>';

  if (hasRef) {
    html += '<div class="reflection-content">' + escapeHtml(reflection) + '</div>';
  } else {
    html += '<div class="reflection-content empty">该日未填写感想</div>';
  }

  container.innerHTML = html;
}

function updateStats() {
  var totalReviews = 0, totalOutputs = 0, totalReflections = 0;

  if (reviewIndex.reports) {
    Object.keys(reviewIndex.reports).forEach(function(ds) {
      totalReviews++;
      totalOutputs += (reviewIndex.reports[ds].outputs && reviewIndex.reports[ds].outputs.length) || 0;
    });
  }
  if (reviewIndex.reflections) {
    Object.keys(reviewIndex.reflections).forEach(function(ds) {
      if (reviewIndex.reflections[ds] && reviewIndex.reflections[ds].trim()) totalReflections++;
    });
  }

  document.getElementById('stat-total').textContent = totalReviews;
  document.getElementById('stat-outputs').textContent = totalOutputs;
  document.getElementById('stat-reflections').textContent = totalReflections;
}

function formatDate(date) {
  var y = date.getFullYear();
  var m = String(date.getMonth() + 1).padStart(2, '0');
  var d = String(date.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

function escapeHtml(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
